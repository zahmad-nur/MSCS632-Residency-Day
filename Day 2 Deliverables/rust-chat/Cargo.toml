[package]
name = "rust-chat"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util"] }
